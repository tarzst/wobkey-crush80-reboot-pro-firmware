name: tests

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 src/build_firmware.py firmware/official/Crush80-RGB-20260618-official.bin /tmp/rc2.bin
      - run: echo '7663f2fc7357ce3f4ae7f1331577c8e0f2a1bd0f7b1c038a89a6efab31ce7d88  /tmp/rc2.bin' | sha256sum -c -
